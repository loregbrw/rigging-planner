name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build
        run: dotnet build RiggingPlanner.slnx -c Release

      - name: Test
        run: dotnet test tests/RiggingPlanner.Domain.Tests -c Release --no-build
